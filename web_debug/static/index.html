<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RMV Debug Dashboard</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #101316;
            --surface: #181d21;
            --surface-raised: #20262b;
            --line: #30383e;
            --text: #eef2f3;
            --muted: #9ba7ad;
            --accent: #45c4b0;
            --accent-soft: #153c37;
            --warning: #e3ad4a;
            --danger: #e16b65;
            --grid: #293136;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            letter-spacing: 0;
        }

        button, select { font: inherit; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 20px;
            min-height: 64px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(16, 19, 22, 0.96);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: max-content;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border: 1px solid #367c72;
            border-radius: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            line-height: 1.25;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .connection {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: max-content;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
        }

        .connection.online .status-dot { background: var(--accent); }
        .connection.offline .status-dot { background: var(--danger); }

        .fire-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: max-content;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .fire-status .fire-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--muted);
        }

        .fire-status.fire-on {
            border-color: #7c3a36;
            background: #2a1614;
            color: #f29b96;
        }

        .fire-status.fire-on .fire-dot { background: var(--danger); }

        .toolbar {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .field {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .btn, select {
            min-height: 34px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface-raised);
            color: var(--text);
        }

        .btn {
            padding: 0 12px;
            cursor: pointer;
        }

        .btn:hover, select:hover { border-color: #526068; }
        .btn:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn.active {
            border-color: #367c72;
            background: var(--accent-soft);
            color: var(--accent);
        }

        select { padding: 0 28px 0 10px; }

        main { padding: 18px 20px 30px; }

        #charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
            gap: 12px;
            align-items: start;
        }

        .chart-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
        }

        .chart-header {
            display: flex;
            min-height: 46px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px 8px 12px;
            border-bottom: 1px solid var(--line);
        }

        .metric-info {
            display: flex;
            min-width: 0;
            align-items: baseline;
            gap: 10px;
        }

        .metric-name {
            overflow: hidden;
            color: var(--muted);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .metric-value {
            min-width: 72px;
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .card-actions { display: flex; gap: 4px; }

        .icon-btn {
            width: 34px;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .icon-btn:hover { background: var(--surface-raised); color: var(--text); }
        .icon-btn:focus-visible { outline: 2px solid var(--accent); }

        .chart-wrap {
            width: 100%;
            height: 250px;
            padding: 8px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .chart-card.collapsed .chart-wrap { display: none; }
        .chart-card.collapsed .chart-header { border-bottom: 0; }

        .empty-state {
            grid-column: 1 / -1;
            display: grid;
            min-height: 260px;
            place-items: center;
            border: 1px dashed #3a444a;
            border-radius: 6px;
            color: var(--muted);
            text-align: center;
        }

        .empty-title { color: var(--text); font-size: 15px; font-weight: 650; }
        .empty-detail { margin-top: 6px; font-size: 12px; }

        /* 角速度专用小窗：固定在面板顶部，把测量 ω 与 EKF ω 叠在一张图里对照。 */
        #omegaSection { margin-bottom: 12px; }

        #omegaCard { width: 100%; }

        .omega-readout {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
        }

        .omega-readout .item {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
        }

        .omega-readout .dot {
            align-self: center;
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .omega-readout .label { color: var(--muted); font-size: 12px; }

        .omega-readout .num {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 20px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.2px;
        }

        .omega-wrap { height: 300px; }

        #omegaCard.collapsed .chart-wrap,
        #omegaCard.collapsed .omega-readout { display: none; }
        #omegaCard.collapsed .chart-header { border-bottom: 0; }

        @media (max-width: 850px) {
            .topbar { align-items: flex-start; flex-wrap: wrap; }
            .connection { margin-left: auto; }
            .toolbar { flex-basis: 100%; justify-content: flex-start; }
        }

        @media (max-width: 520px) {
            .topbar, main { padding-left: 12px; padding-right: 12px; }
            .toolbar { gap: 6px; }
            .field { width: 100%; justify-content: space-between; }
            .btn { flex: 1; padding: 0 8px; }
            .chart-wrap { height: 220px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">RMV</div>
            <div>
                <h1>视觉调试面板</h1>
                <div class="subtitle">Real-time numeric telemetry</div>
            </div>
        </div>

        <div id="connection" class="connection connecting" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connectionText">正在连接</span>
        </div>

        <div id="fireStatus" class="fire-status" role="status" aria-live="polite"
            title="EKF 开火许可（稳定 + yaw 误差小 + 距离在射程内）">
            <span class="fire-dot" aria-hidden="true"></span>
            <span id="fireText">待机</span>
        </div>

        <div class="toolbar">
            <label class="field" for="timeWindow">
                时间窗
                <select id="timeWindow">
                    <option value="15">15 秒</option>
                    <option value="30" selected>30 秒</option>
                    <option value="60">1 分钟</option>
                    <option value="300">5 分钟</option>
                    <option value="0">全部</option>
                </select>
            </label>
            <button id="pauseButton" class="btn" type="button" aria-pressed="false">暂停</button>
            <button id="clearButton" class="btn" type="button">清空</button>
            <button id="exportButton" class="btn" type="button">导出 CSV</button>
        </div>
    </header>

    <main>
        <section id="omegaSection" aria-live="polite">
            <article id="omegaCard" class="chart-card">
                <header class="chart-header">
                    <div class="metric-info">
                        <span class="metric-name" title="角速度 ω（测量 vs EKF）">角速度 ω（测量 vs EKF）· deg/s</span>
                    </div>
                    <div class="card-actions">
                        <button id="omegaExportButton" type="button" class="icon-btn"
                            title="导出角速度 CSV" aria-label="导出角速度 CSV">CSV</button>
                        <button id="omegaCollapseButton" type="button" class="icon-btn"
                            title="折叠角速度小窗" aria-label="折叠角速度小窗"
                            aria-expanded="true">v</button>
                    </div>
                </header>
                <div class="omega-readout">
                    <span class="item">
                        <span class="dot" style="background: #e3ad4a" aria-hidden="true"></span>
                        <span class="label">测量 ω</span>
                        <span class="num" id="omegaMeasNum">-</span>
                    </span>
                    <span class="item">
                        <span class="dot" style="background: #45c4b0" aria-hidden="true"></span>
                        <span class="label">EKF ω</span>
                        <span class="num" id="omegaEkfNum">-</span>
                    </span>
                </div>
                <div class="chart-wrap omega-wrap">
                    <canvas id="omegaCanvas" role="img" aria-label="角速度曲线"></canvas>
                </div>
            </article>
        </section>

        <section id="charts" aria-live="polite"></section>
    </main>

    <script>
        (() => {
            "use strict";

            const MAX_HISTORY_POINTS = 5000;
            const chartsRoot = document.getElementById("charts");
            const connection = document.getElementById("connection");
            const connectionText = document.getElementById("connectionText");
            const pauseButton = document.getElementById("pauseButton");
            const clearButton = document.getElementById("clearButton");
            const exportButton = document.getElementById("exportButton");
            const timeWindow = document.getElementById("timeWindow");

            // 开火状态指示灯：数据来自 webdebug 上报的 fire_allowed（0/1）。
            const FIRE_KEY = "fire_allowed";
            const fireStatus = document.getElementById("fireStatus");
            const fireText = document.getElementById("fireText");

            function setFireState(on) {
                fireStatus.classList.toggle("fire-on", on);
                fireText.textContent = on ? "开火" : "待机";
            }

            // 每个指标名称对应一张图表，并在浏览器内维护自己的历史记录。
            const charts = new Map();
            let paused = false;
            let streamState = "connecting";
            let eventSource = null;

            // 角速度专用小窗：把测量 ω 与 EKF ω 两条曲线叠在一张图里（deg/s），
            // 数据来自 webdebug 已上报的 meas_yaw_rate_rad_s / ekf_yaw_rate_rad_s。
            const OMEGA_MEAS_KEY = "meas_yaw_rate_rad_s";
            const OMEGA_EKF_KEY = "ekf_yaw_rate_rad_s";
            const RAD_TO_DEG = 180 / Math.PI;
            const omegaCard = document.getElementById("omegaCard");
            const omegaCanvas = document.getElementById("omegaCanvas");
            const omegaMeasNum = document.getElementById("omegaMeasNum");
            const omegaEkfNum = document.getElementById("omegaEkfNum");
            const omegaExportButton = document.getElementById("omegaExportButton");
            const omegaCollapseButton = document.getElementById("omegaCollapseButton");
            const omegaSeries = {
                meas: { history: [], color: "#e3ad4a" },
                ekf: { history: [], color: "#45c4b0" }
            };
            let omegaDirty = true;

            function setConnectionState(state, label) {
                streamState = state;
                connection.className = `connection ${state}`;
                connectionText.textContent = label;
                updateEmptyState();
            }

            function updateEmptyState() {
                const existing = document.getElementById("emptyState");
                if (charts.size > 0) {
                    if (existing) existing.remove();
                    return;
                }

                const empty = existing || document.createElement("div");
                empty.id = "emptyState";
                empty.className = "empty-state";
                const detail = streamState === "online"
                    ? "等待处理线程发送数值"
                    : streamState === "offline"
                        ? "数据连接已断开"
                        : "正在建立数据连接";
                empty.innerHTML = "";
                const content = document.createElement("div");
                const title = document.createElement("div");
                title.className = "empty-title";
                title.textContent = "暂无调试数据";
                const message = document.createElement("div");
                message.className = "empty-detail";
                message.textContent = detail;
                content.append(title, message);
                empty.appendChild(content);
                if (!existing) chartsRoot.appendChild(empty);
            }

            function formatValue(value) {
                const absolute = Math.abs(value);
                if (absolute !== 0 && (absolute >= 100000 || absolute < 0.001)) {
                    return value.toExponential(3);
                }
                return value.toFixed(3).replace(/\.0+$|(\.\d*?)0+$/, "$1");
            }

            function makeChart(key) {
                const card = document.createElement("article");
                card.className = "chart-card";

                const header = document.createElement("header");
                header.className = "chart-header";
                const info = document.createElement("div");
                info.className = "metric-info";
                const name = document.createElement("span");
                name.className = "metric-name";
                name.title = key;
                name.textContent = key;
                const value = document.createElement("span");
                value.className = "metric-value";
                value.textContent = "-";
                info.append(name, value);

                const actions = document.createElement("div");
                actions.className = "card-actions";
                const csvButton = document.createElement("button");
                csvButton.type = "button";
                csvButton.className = "icon-btn";
                csvButton.title = `导出 ${key} CSV`;
                csvButton.setAttribute("aria-label", csvButton.title);
                csvButton.textContent = "CSV";
                const collapseButton = document.createElement("button");
                collapseButton.type = "button";
                collapseButton.className = "icon-btn";
                collapseButton.title = "折叠图表";
                collapseButton.setAttribute("aria-label", collapseButton.title);
                collapseButton.setAttribute("aria-expanded", "true");
                collapseButton.textContent = "v";
                actions.append(csvButton, collapseButton);
                header.append(info, actions);

                const wrap = document.createElement("div");
                wrap.className = "chart-wrap";
                const canvas = document.createElement("canvas");
                canvas.setAttribute("role", "img");
                canvas.setAttribute("aria-label", `${key} 曲线`);
                wrap.appendChild(canvas);
                card.append(header, wrap);
                chartsRoot.appendChild(card);

                const chart = { key, card, canvas, value, history: [], dirty: true };
                charts.set(key, chart);
                updateEmptyState();

                csvButton.addEventListener("click", () => exportMetric(chart));
                collapseButton.addEventListener("click", () => {
                    const collapsed = card.classList.toggle("collapsed");
                    collapseButton.textContent = collapsed ? ">" : "v";
                    collapseButton.title = collapsed ? "展开图表" : "折叠图表";
                    collapseButton.setAttribute("aria-label", collapseButton.title);
                    collapseButton.setAttribute("aria-expanded", String(!collapsed));
                    if (!collapsed) {
                        chart.dirty = true;
                        renderChart(chart);
                    }
                });
                return chart;
            }

            function appendPoint(point) {
                if (!point || typeof point.k !== "string" || point.k.length === 0) return;
                const numericValue = Number(point.v);
                const timestamp = Number(point.t);
                if (!Number.isFinite(numericValue) || !Number.isFinite(timestamp)) return;

                const chart = charts.get(point.k) || makeChart(point.k);
                // 限制浏览器历史记录的长度，避免暂停或长时间运行时无限增长。
                chart.history.push({ t: timestamp, v: numericValue });
                if (chart.history.length > MAX_HISTORY_POINTS) {
                    chart.history.splice(0, chart.history.length - MAX_HISTORY_POINTS);
                }
                chart.dirty = true;

                if (point.k === OMEGA_MEAS_KEY || point.k === OMEGA_EKF_KEY) {
                    const which = point.k === OMEGA_MEAS_KEY ? "meas" : "ekf";
                    omegaSeries[which].history.push({ t: timestamp, v: numericValue });
                    if (omegaSeries[which].history.length > MAX_HISTORY_POINTS) {
                        omegaSeries[which].history.splice(
                            0, omegaSeries[which].history.length - MAX_HISTORY_POINTS);
                    }
                    omegaDirty = true;
                }

                if (point.k === FIRE_KEY) {
                    setFireState(numericValue > 0.5);
                }
            }

            function visiblePoints(history) {
                if (history.length === 0) return history;
                const seconds = Number(timeWindow.value);
                if (seconds === 0) return history;
                // 时间窗口以最新样本为基准，这样回放历史数据时也能正常工作。
                const cutoff = history[history.length - 1].t - seconds * 1000;
                let first = history.length - 1;
                while (first > 0 && history[first - 1].t >= cutoff) first -= 1;
                return history.slice(first);
            }

            function renderChart(chart) {
                if (!chart.dirty || chart.card.classList.contains("collapsed")) return;
                chart.dirty = false;

                const points = visiblePoints(chart.history);
                if (chart.history.length > 0) {
                    chart.value.textContent = formatValue(chart.history[chart.history.length - 1].v);
                }

                const rect = chart.canvas.getBoundingClientRect();
                if (rect.width < 10 || rect.height < 10) return;
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                chart.canvas.width = Math.round(rect.width * ratio);
                chart.canvas.height = Math.round(rect.height * ratio);
                const ctx = chart.canvas.getContext("2d");
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.clearRect(0, 0, rect.width, rect.height);

                const plot = { left: 58, top: 12, right: rect.width - 12, bottom: rect.height - 28 };
                const plotWidth = Math.max(1, plot.right - plot.left);
                const plotHeight = Math.max(1, plot.bottom - plot.top);

                if (points.length === 0) {
                    ctx.fillStyle = "#9ba7ad";
                    ctx.font = "12px system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("暂无数据", rect.width / 2, rect.height / 2);
                    return;
                }

                let min = points[0].v;
                let max = points[0].v;
                for (const point of points) {
                    min = Math.min(min, point.v);
                    max = Math.max(max, point.v);
                }
                const spread = max - min;
                const padding = spread === 0 ? Math.max(Math.abs(max) * 0.08, 0.5) : spread * 0.1;
                min -= padding;
                max += padding;

                ctx.strokeStyle = "#293136";
                ctx.fillStyle = "#9ba7ad";
                ctx.lineWidth = 1;
                ctx.font = "11px system-ui, sans-serif";
                ctx.textBaseline = "middle";
                for (let line = 0; line <= 4; line += 1) {
                    const y = plot.top + (plotHeight * line) / 4;
                    ctx.beginPath();
                    ctx.moveTo(plot.left, Math.round(y) + 0.5);
                    ctx.lineTo(plot.right, Math.round(y) + 0.5);
                    ctx.stroke();
                    ctx.textAlign = "right";
                    ctx.fillText(formatValue(max - ((max - min) * line) / 4), plot.left - 7, y);
                }

                const firstTime = points[0].t;
                const lastTime = points[points.length - 1].t;
                const timeSpan = Math.max(1, lastTime - firstTime);
                ctx.textBaseline = "alphabetic";
                ctx.textAlign = "left";
                ctx.fillText(new Date(firstTime).toLocaleTimeString(), plot.left, rect.height - 7);
                ctx.textAlign = "right";
                ctx.fillText(new Date(lastTime).toLocaleTimeString(), plot.right, rect.height - 7);

                // 仅对绘图数据降采样；导出的 CSV 仍保留完整的浏览器历史记录。
                const maxRenderedPoints = Math.max(100, Math.floor(plotWidth * 2));
                const step = Math.max(1, Math.ceil(points.length / maxRenderedPoints));
                ctx.beginPath();
                ctx.strokeStyle = "#45c4b0";
                ctx.lineWidth = 1.7;
                let started = false;
                for (let index = 0; index < points.length; index += step) {
                    const point = points[index];
                    const x = plot.left + ((point.t - firstTime) / timeSpan) * plotWidth;
                    const y = plot.bottom - ((point.v - min) / (max - min)) * plotHeight;
                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                const last = points[points.length - 1];
                const lastX = plot.left + ((last.t - firstTime) / timeSpan) * plotWidth;
                const lastY = plot.bottom - ((last.v - min) / (max - min)) * plotHeight;
                ctx.lineTo(lastX, lastY);
                ctx.stroke();
            }

            function visibleOmegaPoints(history) {
                if (history.length === 0) return history;
                const seconds = Number(timeWindow.value);
                if (seconds === 0) return history;
                const cutoff = history[history.length - 1].t - seconds * 1000;
                let first = history.length - 1;
                while (first > 0 && history[first - 1].t >= cutoff) first -= 1;
                return history.slice(first);
            }

            function formatDegPerSec(radPerSec) {
                const deg = radPerSec * RAD_TO_DEG;
                const sign = deg >= 0 ? "+" : "";
                return `${sign}${deg.toFixed(1)}`;
            }

            function strokeOmegaSeries(ctx, points, color, tMin, tSpan, vMin, vMax, plot) {
                if (points.length === 0) return;
                const plotWidth = plot.right - plot.left;
                const plotHeight = plot.bottom - plot.top;
                const maxRenderedPoints = Math.max(100, Math.floor(plotWidth * 2));
                const step = Math.max(1, Math.ceil(points.length / maxRenderedPoints));
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.8;
                let started = false;
                for (let i = 0; i < points.length; i += step) {
                    const p = points[i];
                    const x = plot.left + ((p.t - tMin) / tSpan) * plotWidth;
                    const deg = p.v * RAD_TO_DEG;
                    const y = plot.bottom - ((deg - vMin) / (vMax - vMin)) * plotHeight;
                    if (!started) { ctx.moveTo(x, y); started = true; }
                    else ctx.lineTo(x, y);
                }
                const lastP = points[points.length - 1];
                const lastDeg = lastP.v * RAD_TO_DEG;
                const lastX = plot.left + ((lastP.t - tMin) / tSpan) * plotWidth;
                const lastY = plot.bottom - ((lastDeg - vMin) / (vMax - vMin)) * plotHeight;
                ctx.lineTo(lastX, lastY);
                ctx.stroke();
            }

            function renderOmega(force) {
                if (force) omegaDirty = true;
                if (!omegaDirty) return;
                omegaDirty = false;

                const meas = visibleOmegaPoints(omegaSeries.meas.history);
                const ekf = visibleOmegaPoints(omegaSeries.ekf.history);
                if (meas.length > 0) {
                    omegaMeasNum.textContent = formatDegPerSec(meas[meas.length - 1].v);
                }
                if (ekf.length > 0) {
                    omegaEkfNum.textContent = formatDegPerSec(ekf[ekf.length - 1].v);
                }

                const rect = omegaCanvas.getBoundingClientRect();
                if (rect.width < 10 || rect.height < 10) return;
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                omegaCanvas.width = Math.round(rect.width * ratio);
                omegaCanvas.height = Math.round(rect.height * ratio);
                const ctx = omegaCanvas.getContext("2d");
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.clearRect(0, 0, rect.width, rect.height);

                if (meas.length === 0 && ekf.length === 0) {
                    ctx.fillStyle = "#9ba7ad";
                    ctx.font = "12px system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("暂无角速度数据", rect.width / 2, rect.height / 2);
                    return;
                }

                const all = meas.concat(ekf);
                let tMin = Infinity, tMax = -Infinity, vMin = Infinity, vMax = -Infinity;
                for (const p of all) {
                    const deg = p.v * RAD_TO_DEG;
                    if (p.t < tMin) tMin = p.t;
                    if (p.t > tMax) tMax = p.t;
                    if (deg < vMin) vMin = deg;
                    if (deg > vMax) vMax = deg;
                }
                // 零点必在视野内，转动的正负方向一眼可见。
                vMin = Math.min(vMin, 0);
                vMax = Math.max(vMax, 0);
                const tSpan = Math.max(1, tMax - tMin);
                const spread = vMax - vMin;
                const pad = spread === 0 ? Math.max(Math.abs(vMax) * 0.08, 20) : spread * 0.1;
                vMin -= pad;
                vMax += pad;

                const plot = { left: 58, top: 12, right: rect.width - 12, bottom: rect.height - 28 };
                const plotWidth = Math.max(1, plot.right - plot.left);
                const plotHeight = Math.max(1, plot.bottom - plot.top);

                ctx.font = "11px system-ui, sans-serif";
                for (let line = 0; line <= 4; line += 1) {
                    const y = plot.top + (plotHeight * line) / 4;
                    const value = vMax - ((vMax - vMin) * line) / 4;
                    const isZero = Math.abs(value) < (vMax - vMin) * 0.005;
                    ctx.strokeStyle = isZero ? "#66747c" : "#293136";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(plot.left, Math.round(y) + 0.5);
                    ctx.lineTo(plot.right, Math.round(y) + 0.5);
                    ctx.stroke();
                    ctx.fillStyle = "#9ba7ad";
                    ctx.textAlign = "right";
                    ctx.textBaseline = "middle";
                    ctx.fillText(formatValue(value), plot.left - 7, y);
                }

                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#9ba7ad";
                ctx.textAlign = "left";
                ctx.fillText(new Date(tMin).toLocaleTimeString(), plot.left, rect.height - 7);
                ctx.textAlign = "right";
                ctx.fillText(new Date(tMax).toLocaleTimeString(), plot.right, rect.height - 7);

                strokeOmegaSeries(ctx, meas, omegaSeries.meas.color, tMin, tSpan, vMin, vMax, plot);
                strokeOmegaSeries(ctx, ekf, omegaSeries.ekf.color, tMin, tSpan, vMin, vMax, plot);
            }

            function renderAll(force = false) {
                if (paused && !force) return;
                for (const chart of charts.values()) renderChart(chart);
                renderOmega(force);
            }

            function csvCell(value) {
                const text = String(value);
                return `"${text.replace(/"/g, '""')}"`;
            }

            function triggerDownload(filename, rows) {
                const blob = new Blob(["\ufeff", rows.join("\n")], {
                    type: "text/csv;charset=utf-8"
                });
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = filename;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                URL.revokeObjectURL(url);
            }

            function safeFilename(name) {
                const safe = name.replace(/[^a-zA-Z0-9_-]+/g, "_").replace(/^_+|_+$/g, "");
                return safe || "metric";
            }

            function exportMetric(chart) {
                const rows = ["timestamp,time,value"];
                for (const point of chart.history) {
                    rows.push(`${point.t},${csvCell(new Date(point.t).toISOString())},${point.v}`);
                }
                triggerDownload(`${safeFilename(chart.key)}.csv`, rows);
            }

            function exportAll() {
                const rows = ["metric,timestamp,time,value"];
                for (const chart of charts.values()) {
                    for (const point of chart.history) {
                        rows.push(`${csvCell(chart.key)},${point.t},${csvCell(new Date(point.t).toISOString())},${point.v}`);
                    }
                }
                const stamp = new Date().toISOString().replace(/[:.]/g, "-");
                triggerDownload(`rmv-debug-${stamp}.csv`, rows);
            }

            pauseButton.addEventListener("click", () => {
                paused = !paused;
                pauseButton.classList.toggle("active", paused);
                pauseButton.setAttribute("aria-pressed", String(paused));
                pauseButton.textContent = paused ? "继续" : "暂停";
                if (!paused) renderAll(true);
            });

            clearButton.addEventListener("click", () => {
                charts.clear();
                chartsRoot.replaceChildren();
                omegaSeries.meas.history.length = 0;
                omegaSeries.ekf.history.length = 0;
                omegaMeasNum.textContent = "-";
                omegaEkfNum.textContent = "-";
                omegaDirty = true;
                renderOmega(true);
                setFireState(false);
                updateEmptyState();
            });

            exportButton.addEventListener("click", exportAll);

            function exportOmega() {
                const rows = ["series,timestamp,time,value_rad_s,value_deg_s"];
                for (const [name, series] of [["meas", omegaSeries.meas], ["ekf", omegaSeries.ekf]]) {
                    for (const p of series.history) {
                        rows.push(`${name},${p.t},${csvCell(new Date(p.t).toISOString())},${p.v},${p.v * RAD_TO_DEG}`);
                    }
                }
                triggerDownload("omega.csv", rows);
            }

            omegaExportButton.addEventListener("click", exportOmega);
            omegaCollapseButton.addEventListener("click", () => {
                const collapsed = omegaCard.classList.toggle("collapsed");
                omegaCollapseButton.textContent = collapsed ? ">" : "v";
                omegaCollapseButton.title = collapsed ? "展开角速度小窗" : "折叠角速度小窗";
                omegaCollapseButton.setAttribute("aria-label", omegaCollapseButton.title);
                omegaCollapseButton.setAttribute("aria-expanded", String(!collapsed));
                if (!collapsed) { omegaDirty = true; renderOmega(true); }
            });

            timeWindow.addEventListener("change", () => {
                for (const chart of charts.values()) chart.dirty = true;
                renderAll(true);
            });

            window.addEventListener("resize", () => {
                for (const chart of charts.values()) chart.dirty = true;
                renderAll(true);
            });

            function connect() {
                setConnectionState("connecting", "正在连接");
                // EventSource 重连时会把 Last-Event-ID 发送给服务器。
                eventSource = new EventSource("/data");
                eventSource.onopen = () => setConnectionState("online", "数据在线");
                eventSource.onmessage = (event) => {
                    try {
                        const payload = JSON.parse(event.data);
                        if (Array.isArray(payload)) payload.forEach(appendPoint);
                    } catch (error) {
                        console.warn("Invalid SSE payload", error);
                    }
                };
                eventSource.onerror = () => {
                    const closed = eventSource.readyState === EventSource.CLOSED;
                    setConnectionState(closed ? "offline" : "connecting",
                        closed ? "连接已断开" : "正在重连");
                };
            }

            window.addEventListener("beforeunload", () => {
                if (eventSource) eventSource.close();
            });

            updateEmptyState();
            connect();
            window.setInterval(() => renderAll(false), 100);
        })();
    </script>
</body>
</html>
